services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cutz}
      POSTGRES_USER: ${POSTGRES_USER:-cutz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cutz}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cutz} -d ${POSTGRES_DB:-cutz}"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - cutz-postgres:/var/lib/postgresql/data

volumes:
  cutz-postgres:
