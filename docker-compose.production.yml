services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cutz}
      POSTGRES_USER: ${POSTGRES_USER:-cutz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-cutz} -d ${POSTGRES_DB:-cutz}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - cutz-postgres:/var/lib/postgresql/data

  migrate:
    image: ${CUTZ_IMAGE:?CUTZ_IMAGE is required}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cutz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cutz}
    command: ["node", "dist/db/migrate.js"]

  web:
    image: ${CUTZ_IMAGE:?CUTZ_IMAGE is required}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cutz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cutz}
      MEDIA_STORAGE_ROOT: /data/media
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      DEFAULT_PHONE_COUNTRY: ${DEFAULT_PHONE_COUNTRY:-BR}
      OTP_SECRET: ${OTP_SECRET:?OTP_SECRET is required}
      RATE_LIMIT_TRUSTED_PROXY_HOPS: ${RATE_LIMIT_TRUSTED_PROXY_HOPS:-0}
      RATE_LIMIT_TRUST_X_REAL_IP: ${RATE_LIMIT_TRUST_X_REAL_IP:-false}
      RATE_LIMIT_STRICT_MAX: ${RATE_LIMIT_STRICT_MAX:-10}
      RATE_LIMIT_STRICT_WINDOW_MS: ${RATE_LIMIT_STRICT_WINDOW_MS:-60000}
      RATE_LIMIT_MODERATE_MAX: ${RATE_LIMIT_MODERATE_MAX:-30}
      RATE_LIMIT_MODERATE_WINDOW_MS: ${RATE_LIMIT_MODERATE_WINDOW_MS:-60000}
      RATE_LIMIT_LOOSE_MAX: ${RATE_LIMIT_LOOSE_MAX:-120}
      RATE_LIMIT_LOOSE_WINDOW_MS: ${RATE_LIMIT_LOOSE_WINDOW_MS:-60000}
      MAX_FUTURE_APPOINTMENTS_PER_CUSTOMER: ${MAX_FUTURE_APPOINTMENTS_PER_CUSTOMER:-5}
      MAX_ACTIVE_WAITLIST_ENTRIES_PER_CUSTOMER: ${MAX_ACTIVE_WAITLIST_ENTRIES_PER_CUSTOMER:-5}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}

    volumes:
      - cutz-media:/data/media
    command: ["node", "node_modules/next/dist/bin/next", "start", "--hostname", "0.0.0.0", "--port", "3000"]

  worker:
    image: ${CUTZ_IMAGE:?CUTZ_IMAGE is required}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cutz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cutz}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      MESSAGING_PROVIDER: ${MESSAGING_PROVIDER:-fake}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-pt_BR}
      WHATSAPP_TEMPLATE_APPOINTMENT_CREATED: ${WHATSAPP_TEMPLATE_APPOINTMENT_CREATED:-}
      WHATSAPP_TEMPLATE_APPOINTMENT_RESCHEDULED: ${WHATSAPP_TEMPLATE_APPOINTMENT_RESCHEDULED:-}
      WHATSAPP_TEMPLATE_APPOINTMENT_REMINDER: ${WHATSAPP_TEMPLATE_APPOINTMENT_REMINDER:-}
      WHATSAPP_TEMPLATE_APPOINTMENT_CANCELLED: ${WHATSAPP_TEMPLATE_APPOINTMENT_CANCELLED:-}
      WHATSAPP_TEMPLATE_WAITLIST_ENTRY_CREATED: ${WHATSAPP_TEMPLATE_WAITLIST_ENTRY_CREATED:-}
      WHATSAPP_TEMPLATE_WAITLIST_OFFER: ${WHATSAPP_TEMPLATE_WAITLIST_OFFER:-}
      WHATSAPP_TEMPLATE_CUSTOMER_OTP: ${WHATSAPP_TEMPLATE_CUSTOMER_OTP:-}
      NOTIFICATION_POLL_MS: ${NOTIFICATION_POLL_MS:-1000}
      WAITLIST_POLL_MS: ${WAITLIST_POLL_MS:-1000}
      WAITLIST_ENTRY_SWEEP_MS: ${WAITLIST_ENTRY_SWEEP_MS:-60000}
      NOTIFICATION_BATCH_SIZE: ${NOTIFICATION_BATCH_SIZE:-25}
      NOTIFICATION_CONCURRENCY: ${NOTIFICATION_CONCURRENCY:-5}
      PROCESSING_LEASE_MS: ${PROCESSING_LEASE_MS:-120000}
      RECOVERY_INTERVAL_MS: ${RECOVERY_INTERVAL_MS:-60000}
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-15000}
      SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-20000}
      DB_ERROR_BACKOFF_MS: ${DB_ERROR_BACKOFF_MS:-5000}
    command: ["node", "dist/worker/index.js"]

volumes:
  cutz-postgres:
  cutz-media:
