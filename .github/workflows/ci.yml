name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Run untrusted pull-request code on an isolated hosted runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: cutz-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CUTZ_IMAGE: cutz-ci:${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: cutz_test
      POSTGRES_USER: cutz
      POSTGRES_PASSWORD: cutz
      POSTGRES_PORT: "55432"
      DATABASE_URL: postgresql://cutz:cutz@127.0.0.1:55432/cutz_test
      TEST_DATABASE_URL: postgresql://cutz:cutz@127.0.0.1:55432/cutz_test
      APP_ORIGIN: http://127.0.0.1:3000
      DEFAULT_PHONE_COUNTRY: BR
      OTP_SECRET: cutz-ci-otp-secret-at-least-32-characters
      SEED_ADMIN_EMAIL: admin@cutz.local
      SEED_ADMIN_PASSWORD: cutz-dev-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        run: cd tests/e2e && pnpm install --ignore-workspace --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check architecture
        run: pnpm arch

      - name: Check migrations
        id: migrations
        run: |
          pnpm db:generate
          git diff --exit-code -- drizzle

      - name: Save migration drift
        if: failure() && steps.migrations.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: migration-drift
          path: drizzle
          if-no-files-found: error
          retention-days: 1

      - name: Unit tests
        run: pnpm test

      - name: Build web
        run: pnpm build

      - name: Build worker
        run: pnpm build:worker

      - name: Build container image
        run: docker build --tag "$CUTZ_IMAGE" .

      - name: Check that the web container can write to its media volume
        run: |
          media_volume="cutz-ci-media-${{ github.run_id }}-${{ github.run_attempt }}"
          docker volume create "$media_volume"
          trap 'docker volume rm -f "$media_volume" >/dev/null' EXIT
          docker run --rm --mount "type=volume,source=$media_volume,target=/data/media" \
            --entrypoint node "$CUTZ_IMAGE" \
            -e 'const fs = require("node:fs"); fs.writeFileSync("/data/media/write-test", "ok"); fs.unlinkSync("/data/media/write-test");'

      - name: Validate production compose
        run: docker compose -f docker-compose.production.yml config >/dev/null

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs postgres
          exit 1

      - name: Apply migrations from production image
        run: docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" "$CUTZ_IMAGE" pnpm start:migrate

      - name: Bootstrap database from production image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SEED_ADMIN_EMAIL="$SEED_ADMIN_EMAIL" \
            -e SEED_ADMIN_PASSWORD="$SEED_ADMIN_PASSWORD" \
            "$CUTZ_IMAGE" pnpm start:bootstrap

      - name: Verify production bootstrap
        run: |
          tenant_count="$(docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select count(*) from barbershops where slug = 'demo'")"
          fixture_count="$(docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select count(*) from customers where name in ('E2E Complete', 'E2E No-show')")"
          test "$tenant_count" = "1"
          test "$fixture_count" = "0"

      - name: Seed database
        run: pnpm db:seed

      - name: Integration tests
        run: pnpm test:integration

      - name: Install Chromium
        run: cd tests/e2e && pnpm --ignore-workspace run install:chromium

      - name: Start web
        run: |
          pnpm start > /tmp/cutz-web-${{ github.run_id }}.log 2>&1 &
          echo $! > .cutz-web.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$APP_ORIGIN/api/health" >/dev/null && \
               curl --fail --silent --show-error "$APP_ORIGIN/b/demo" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cutz-web-${{ github.run_id }}.log
          exit 1

      - name: E2E tests
        run: cd tests/e2e && pnpm --ignore-workspace run test

      - name: Clean up
        if: always()
        run: |
          if [ -f .cutz-web.pid ]; then
            kill "$(cat .cutz-web.pid)" >/dev/null 2>&1 || true
          fi
          docker compose down -v --remove-orphans
          docker image rm -f "$CUTZ_IMAGE" >/dev/null 2>&1 || true


  publish:
    name: Build ${{ matrix.arch }} image
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            node_arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            node_arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "commit_tag=$image:sha-$GITHUB_SHA-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.arch }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ steps.image.outputs.commit_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Scheduling and waitlist application

      - name: Validate native runtime
        env:
          IMAGE: ${{ steps.image.outputs.commit_tag }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')" = "linux/$EXPECTED_ARCH"
          docker run --rm --platform "linux/$EXPECTED_ARCH" -e EXPECTED_NODE_ARCH="$EXPECTED_NODE_ARCH" --entrypoint /bin/sh "$IMAGE" -ec '
            node_arch="$(node -p "process.arch")"
            echo "Node.js architecture: $node_arch (expected: $EXPECTED_NODE_ARCH)"
            test "$node_arch" = "$EXPECTED_NODE_ARCH"
            test -f dist/db/migrate.js
            test -f dist/db/bootstrap.js
            test -f dist/worker/index.js
            node node_modules/next/dist/bin/next --version
            node -e "const argon2 = require(\"argon2\"); argon2.hash(\"runtime-check\").then(hash => argon2.verify(hash, \"runtime-check\")).then(valid => { if (!valid) process.exit(1); }).catch(error => { console.error(error); process.exit(1); });"
          '

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish architecture tag
        env:
          COMMIT_TAG: ${{ steps.image.outputs.commit_tag }}
        run: docker push "$COMMIT_TAG"

  publish_manifest:
    name: Publish multi-arch manifest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-$GITHUB_SHA"
          docker buildx imagetools create \
            --tag "$image:$tag" \
            --tag "$image:latest" \
            "$image:$tag-amd64" \
            "$image:$tag-arm64"

      - name: Verify manifest platforms
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$GITHUB_SHA"
          docker buildx imagetools inspect "$image"
          docker buildx imagetools inspect --raw "$image" |
            jq -e '
              [.manifests[].platform | select(.os == "linux") | .architecture] as $arches
              | ($arches | index("amd64") != null) and ($arches | index("arm64") != null)
            '
